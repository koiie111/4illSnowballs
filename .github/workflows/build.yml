name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/versions.py
  build:
    needs: resolve
    if: needs.resolve.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        css: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet run -c Release --project tests
      - run: dotnet build src -c Release -p:CounterStrikeSharpVersion=${{ matrix.css }}
      - run: python3 scripts/package.py "${{ matrix.css }}" "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: snowballs-${{ matrix.css }}-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: snowballs-*
          path: artifacts
      - run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease --title "4illSnowballs $GITHUB_REF_NAME" --notes "Experimental build for game testing. Review the README before installing.")
          else
            flags+=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" artifacts/*/* --repo "$GITHUB_REPOSITORY" --verify-tag "${flags[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
